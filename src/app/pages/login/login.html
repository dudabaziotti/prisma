<section class="card auth-card">
  <img src="prisma-logo.jpg" alt="Prisma" class="auth-logo" />
  <h1>Bem-vindo(a) de volta!</h1>
  <p class="subtitle muted">
    Não tem uma conta? <a routerLink="/cadastro" data-test="link-cadastro">Cadastre-se</a>
  </p>

  @if (contaExcluida()) {
    <p class="notice" data-test="aviso-conta-excluida">Sua conta e suas publicações foram excluídas.</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>E-mail</span>
      <input type="email" formControlName="email" autocomplete="email" data-test="login-email" />
    </label>
    <label class="field">
      <span>Senha</span>
      <input type="password" formControlName="password" autocomplete="current-password" data-test="login-senha" />
    </label>

    @if (error()) {
      <p class="error" role="alert" data-test="login-erro">{{ error() }}</p>
    }

    <button class="btn btn-primary btn-block" type="submit" [disabled]="loading()" data-test="login-entrar">
      {{ loading() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>
</section>
