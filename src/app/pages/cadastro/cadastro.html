<section class="card auth-card">
  <img src="prisma-logo.jpg" alt="Prisma" class="auth-logo" />
  <h1>Crie sua conta</h1>
  <p class="subtitle muted">Já tem uma conta? <a routerLink="/login" data-test="link-login">Entrar</a></p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field" [class.invalid]="showError('name')">
      <span>Nome completo</span>
      <input type="text" formControlName="name" autocomplete="name" data-test="cadastro-nome" />
      @if (showError('name')) {
        <small class="field-error" data-test="erro-nome">Informe seu nome (2 a 60 caracteres).</small>
      }
    </label>

    <label class="field" [class.invalid]="showError('email')">
      <span>E-mail</span>
      <input type="email" formControlName="email" autocomplete="email" data-test="cadastro-email" />
      @if (showError('email')) {
        <small class="field-error" data-test="erro-email">Informe um e-mail válido.</small>
      }
    </label>

    <label class="field" [class.invalid]="showError('password')">
      <span>Senha</span>
      <input type="password" formControlName="password" autocomplete="new-password" data-test="cadastro-senha" />
      @if (showError('password')) {
        <small class="field-error" data-test="erro-senha">A senha deve ter pelo menos 6 caracteres.</small>
      }
    </label>

    <label class="field" [class.invalid]="submitted() && form.hasError('mismatch')">
      <span>Confirmar senha</span>
      <input type="password" formControlName="confirm" autocomplete="new-password" data-test="cadastro-confirmar" />
      @if (submitted() && form.hasError('mismatch')) {
        <small class="field-error" data-test="erro-confirmar">As senhas não coincidem.</small>
      }
    </label>

    @if (error()) {
      <p class="error" role="alert" data-test="cadastro-erro">{{ error() }}</p>
    }

    <button class="btn btn-primary btn-block" type="submit" [disabled]="loading()" data-test="cadastro-enviar">
      {{ loading() ? 'Criando conta...' : 'Criar conta' }}
    </button>
  </form>
</section>
